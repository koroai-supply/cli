[package]
name = "koroai-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Command-line client for the Koroai Public API"
repository = "https://github.com/koroai-supply/cli"

[[bin]]
name = "ks"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json = "1.0.154"
ureq = "2.12.1"
url = "2.5.8"
uuid = "1.29.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
